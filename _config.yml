title: Tobi.log
description: Nơi mình ghi lại chuyện AI, blockchain, lập trình và cuộc đời làm công nghệ.
author: Long Hoang
nickname: Tobi
github: https://github.com/tobihoang
lang: vi

url: "https://tobihoang.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-gist

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

# Bài và trang mặc định là tiếng Việt; bản tiếng Anh đặt `lang: en` và dùng chung `ref` với bản tiếng Việt.
defaults:
  - scope:
      path: ""
    values:
      lang: vi
